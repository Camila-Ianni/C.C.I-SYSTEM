# deploy/coturn.conf
# Configuración endurecida de servidor TURN/STUN (coturn) para WebRTC NAT Traversal.
# El secreto compartido se inyecta por argumento CLI (--static-auth-secret) desde variables de entorno.
# Dominio/realm canónico por defecto: turn.ccisystem.org
listening-port=3478
tls-listening-port=5349
min-port=49152
max-port=49200
realm=turn.ccisystem.org
use-auth-secret
total-quota=100
bps-capacity=0
stale-nonce=600
no-loopback-peers
no-multicast-peers
no-tlsv1
no-tlsv1_1
fingerprint
log-file=stdout
