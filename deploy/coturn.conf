# deploy/coturn.conf
# Configuración endurecida de servidor TURN/STUN (coturn) para WebRTC NAT Traversal.
# El secreto compartido se inyecta por argumento CLI (--static-auth-secret) desde variables de entorno.
# Dominio/realm canónico por defecto: turn.ccisystem.org
#
# NOTA OPERATIVA TURN/TLS (Fase 0.2):
# En esta entrega se habilita STUN/TURN estándar en el puerto 3478 (UDP y TCP) autenticado con
# credenciales efímeras HMAC-SHA1 (use-auth-secret). TURNS sobre TLS/DTLS (puerto 5349) se
# deshabilita explícitamente (no-tls / no-dtls) hasta que se aprovisionen y monten certificados
# X.509 dedicados (cert=/etc/coturn/certs/fullchain.pem y pkey=/etc/coturn/certs/privkey.pem).
listening-port=3478
no-tls
no-dtls
min-port=49152
max-port=49172
realm=turn.ccisystem.org
use-auth-secret
total-quota=100
bps-capacity=0
stale-nonce=600
no-loopback-peers
no-multicast-peers
fingerprint
log-file=stdout
