# deploy/livekit.yaml
# Configuración de LiveKit SFU para C.C.I. Communities.
# Las claves API/Secret se inyectan obligatoriamente mediante la variable de entorno LIVEKIT_KEYS.
# Dominio TURN canónico unificado: turn.ccisystem.org
port: 7880
bind_addresses:
  - ""
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: true
turn:
  enabled: true
  domain: turn.ccisystem.org
  udp_port: 3478
  external_tls: false
logging:
  json: false
  level: info
