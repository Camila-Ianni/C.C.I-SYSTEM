version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: cci_communities_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cci_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cci_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-cci_communities}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../documentacion/communities/schema_postgres.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cci_user} -d ${POSTGRES_DB:-cci_communities}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cci_backend_net

  redis:
    image: redis:7-alpine
    container_name: cci_communities_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-cci_redis_password}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-cci_redis_password}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cci_backend_net

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: cci_communities_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cci_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cci_minio_secret_key}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks:
      - cci_backend_net

  coturn:
    image: coturn/coturn:4.6.2-alpine
    container_name: cci_communities_coturn
    restart: unless-stopped
    network_mode: host
    environment:
      TURNS_ENABLED: 1
      STATIC_AUTH_SECRET: ${TURN_SECRET:-cci_turn_static_secret_2026}
      REALM: ${DOMAIN:-turn.ccisystem.local}
      MIN_PORT: 49152
      MAX_PORT: 49200
    volumes:
      - ./coturn.conf:/etc/coturn/turnserver.conf:ro

  livekit:
    image: livekit/livekit-server:v1.7.2
    container_name: cci_communities_livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"             # HTTP / Signal API
      - "7881:7881"             # WebRTC TCP fallback
      - "50000-50100:50000-50100/udp" # WebRTC ICE UDP
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-secretkey1234567890abcdef}"
    networks:
      - cci_backend_net

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: cci_communities_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cci_user}:${POSTGRES_PASSWORD:-cci_secret_password}@postgres:5432/${POSTGRES_DB:-cci_communities}
      REDIS_URL: redis://:${REDIS_PASSWORD:-cci_redis_password}@redis:6379/0
      LIVEKIT_HOST: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secretkey1234567890abcdef}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-cci_minio_admin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-cci_minio_secret_key}
      S3_BUCKET_NAME: cci-communities-assets
      SECRET_KEY: ${SECRET_KEY:-cci_jwt_super_secret_signing_key_production}
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - cci_backend_net

  caddy:
    image: caddy:2.7-alpine
    container_name: cci_communities_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - livekit
    networks:
      - cci_backend_net

networks:
  cci_backend_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
