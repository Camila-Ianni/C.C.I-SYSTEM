# deploy/docker-compose.communities.yml
# Orquestación de despliegue para C.C.I. Communities (Motor de persistencia activo: SQLite 3 WAL).
# Requiere un archivo .env basado en deploy/.env.example con secretos reales generados.

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: ${CCI_CONTAINER_PREFIX:-cci_communities}_api
    restart: unless-stopped
    depends_on:
      livekit:
        condition: service_started
    environment:
      CCI_ENV: ${CCI_ENV:-production}
      CCI_HOST: 0.0.0.0
      CCI_PORT: 5050
      CCI_STRICT_SECRETS: "true"
      CCI_SECRET_KEY: ${CCI_SECRET_KEY:?Defina CCI_SECRET_KEY en .env}
      CCI_CORS_ORIGINS: ${CCI_CORS_ORIGINS:-https://ccisystem.org,https://api.ccisystem.org}
      CCI_DATABASE_PATH: /data/cci_system.sqlite3
      CCI_COMMUNITIES_DB_PATH: /data/cci_communities.sqlite3
      CCI_SOUNDS_STORAGE_PATH: /data/sounds
      CCI_RECORDINGS_PATH: /data/recordings
      LIVEKIT_WS_URL: ${LIVEKIT_WS_URL:-wss://rtc.ccisystem.org}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Defina LIVEKIT_API_KEY en .env}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Defina LIVEKIT_API_SECRET en .env}
      TURN_SECRET: ${TURN_SECRET:?Defina TURN_SECRET en .env}
      CCI_TURN_CREDENTIAL: ${TURN_SECRET:?Defina TURN_SECRET en .env}
      CCI_STUN_SERVER: stun:${TURN_DOMAIN:-turn.ccisystem.org}:3478
      CCI_TURN_SERVER: turn:${TURN_DOMAIN:-turn.ccisystem.org}:3478
    volumes:
      - cci_app_data:/data
    ports:
      - "127.0.0.1:${API_HOST_PORT:-15050}:5050"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; r = urllib.request.urlopen('http://127.0.0.1:5050/api/v1/communities/health', timeout=4); sys.exit(0 if r.status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - cci_backend_net

  livekit:
    image: livekit/livekit-server:v1.7.2
    container_name: ${CCI_CONTAINER_PREFIX:-cci_communities}_livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "${LIVEKIT_HTTP_PORT:-7880}:7880"
      - "${LIVEKIT_RTC_TCP_PORT:-7881}:7881"
      - "${LIVEKIT_UDP_RANGE:-50000-50020}:50000-50020/udp"
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?Defina LIVEKIT_API_KEY en .env}: ${LIVEKIT_API_SECRET:?Defina LIVEKIT_API_SECRET en .env}"
    networks:
      - cci_backend_net

  coturn:
    image: coturn/coturn:4.6.2-alpine
    container_name: ${CCI_CONTAINER_PREFIX:-cci_communities}_coturn
    restart: unless-stopped
    command:
      - "-c"
      - "/etc/coturn/turnserver.conf"
      - "--static-auth-secret=${TURN_SECRET:?Defina TURN_SECRET en .env}"
      - "--realm=${TURN_DOMAIN:-turn.ccisystem.org}"
    ports:
      - "${TURN_PORT:-3478}:3478/udp"
      - "${TURN_PORT:-3478}:3478/tcp"
      - "${TURN_RELAY_RANGE:-49152-49172}:49152-49172/udp"
    volumes:
      - ./coturn.conf:/etc/coturn/turnserver.conf:ro
    networks:
      - cci_backend_net

  caddy:
    image: caddy:2.7-alpine
    container_name: ${CCI_CONTAINER_PREFIX:-cci_communities}_caddy
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:-api.ccisystem.org}
      RTC_DOMAIN: ${RTC_DOMAIN:-rtc.ccisystem.org}
      ACME_EMAIL: ${ACME_EMAIL:-ops@ccisystem.org}
      CADDY_TLS_MODE: ${CADDY_TLS_MODE:-ops@ccisystem.org}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      livekit:
        condition: service_started
    networks:
      - cci_backend_net

networks:
  cci_backend_net:
    driver: bridge

volumes:
  cci_app_data:
  caddy_data:
  caddy_config:
