# deploy/docker-compose.communities.yml
# Orquestación de despliegue para C.C.I. Communities.
# Requiere un archivo .env basado en deploy/.env.example sin secretos por defecto.

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: cci_communities_api
    restart: unless-stopped
    depends_on:
      livekit:
        condition: service_started
    environment:
      CCI_ENV: ${CCI_ENV:-production}
      CCI_HOST: 0.0.0.0
      CCI_PORT: 5050
      CCI_STRICT_SECRETS: "true"
      CCI_SECRET_KEY: ${CCI_SECRET_KEY:?Defina CCI_SECRET_KEY en .env}
      CCI_CORS_ORIGINS: ${CCI_CORS_ORIGINS:-https://ccisystem.org}
      CCI_DATABASE_PATH: /data/cci_system.sqlite3
      CCI_COMMUNITIES_DB_PATH: /data/cci_communities.sqlite3
      CCI_SOUNDS_STORAGE_PATH: /data/sounds
      CCI_RECORDINGS_PATH: /data/recordings
      LIVEKIT_WS_URL: ${LIVEKIT_WS_URL:-ws://livekit:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Defina LIVEKIT_API_KEY en .env}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Defina LIVEKIT_API_SECRET en .env}
      CCI_STUN_SERVER: stun:${DOMAIN:-turn.ccisystem.local}:3478
      CCI_TURN_SERVER: turn:${DOMAIN:-turn.ccisystem.local}:3478
    volumes:
      - cci_app_data:/data
    ports:
      - "127.0.0.1:5050:5050"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; r = urllib.request.urlopen('http://127.0.0.1:5050/api/v1/communities/health', timeout=4); sys.exit(0 if r.status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - cci_backend_net

  livekit:
    image: livekit/livekit-server:v1.7.2
    container_name: cci_communities_livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?Defina LIVEKIT_API_KEY en .env}: ${LIVEKIT_API_SECRET:?Defina LIVEKIT_API_SECRET en .env}"
    networks:
      - cci_backend_net

  coturn:
    image: coturn/coturn:4.6.2-alpine
    container_name: cci_communities_coturn
    restart: unless-stopped
    network_mode: host
    command:
      - "-c"
      - "/etc/coturn/turnserver.conf"
      - "--static-auth-secret=${TURN_SECRET:?Defina TURN_SECRET en .env}"
      - "--realm=${DOMAIN:-turn.ccisystem.local}"
    volumes:
      - ./coturn.conf:/etc/coturn/turnserver.conf:ro

  caddy:
    image: caddy:2.7-alpine
    container_name: cci_communities_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      livekit:
        condition: service_started
    networks:
      - cci_backend_net

  # Servicios opcionales para perfil de escalado horizontal (Fase 8+)
  postgres:
    image: postgres:16-alpine
    container_name: cci_communities_postgres
    profiles: ["enterprise-cluster"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cci_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-cci_communities}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../documentacion/communities/schema_postgres.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cci_user} -d ${POSTGRES_DB:-cci_communities}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cci_backend_net

  redis:
    image: redis:7-alpine
    container_name: cci_communities_redis
    profiles: ["enterprise-cluster"]
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Defina REDIS_PASSWORD en .env}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - cci_backend_net

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: cci_communities_minio
    profiles: ["enterprise-cluster"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cci_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Defina MINIO_ROOT_PASSWORD en .env}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks:
      - cci_backend_net

networks:
  cci_backend_net:
    driver: bridge

volumes:
  cci_app_data:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
